apiVersion: apps/v1
kind: Deployment
metadata:
  name: silent-stack-deploy
  labels:
    app: silent-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: silent-stack
  template:
    metadata:
      name: silent-stack
      labels:
        app: silent-stack
    spec:
      containers:
        - name: silent-stack
          image: silent-stack:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: silent-stack-service
spec:
  type: NodePort
  selector:
    app: silent-stack
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
