spring.application.name=beautify-share-front
server.port=8080
server.servlet.context-path=/

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

logging.level.com.pacal.share.dao=debug

# ============= Datasource =============
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/beauty_share?characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=beauty_share
spring.datasource.password=HTaYHE2cmZN54WEm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.druid.min-idle=5
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=30000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=30000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.filters=stat,wall

# ============= Upload =============
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
