version: '1'

services:
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=Pacal123456#
      - MYSQL_DATABASE=stack
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Pacal123456#
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  stack:
    image: pacal/stack
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://10.201.131.34:3306/stack?characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Pacal123456#
    depends_on:
      - db

volumes:
  db_data: